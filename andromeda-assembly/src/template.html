<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andromeda Assembly</title>
<meta name="description" content="Andromeda Assembly — build, test and ship PCs at the Andromeda Insights workshop.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='32' rx='28' ry='12' transform='rotate(-25 32 32)' fill='%238b5cf6'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#07080f; --panel:rgba(14,16,30,.88); --panel2:rgba(22,25,46,.92); --line:rgba(255,255,255,.09);
  --text:#eef0ff; --muted:#9aa3c2; --a:#8b5cf6; --b:#22d3ee; --good:#4ade80; --bad:#f87171; --gold:#facc15;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif; --mono:Consolas,"Cascadia Mono","Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hidden{display:none!important}
button{font-family:var(--font)}
#ui{position:fixed;inset:0;pointer-events:none}
#ui > *{pointer-events:auto}
#ui > .passthru{pointer-events:none}

/* ---------- generic buttons / panels ---------- */
.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--text);padding:12px 20px;border-radius:12px;font-size:15px;font-weight:650;letter-spacing:.02em;cursor:pointer;transition:transform .12s,background .15s,border-color .15s,box-shadow .2s}
.btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--a);background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 55%,var(--b)));border-color:transparent;box-shadow:0 8px 30px -8px var(--a)}
.btn.primary:hover{box-shadow:0 10px 36px -6px var(--a)}
.btn.big{font-size:18px;padding:16px 28px;border-radius:14px}
.btn.small{font-size:13px;padding:8px 12px;border-radius:9px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.kbd{display:inline-block;font-family:var(--mono);font-size:12px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--muted)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(8,8,20,.55),rgba(4,4,10,.86));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:30;animation:fadein .25s ease}
.overlay.shop .card{max-width:min(96vw,1020px)}
.overlay.shop .shopgrid{grid-template-columns:repeat(4,1fr)}
@media (max-width:1000px){.overlay.shop .shopgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.overlay.clear{backdrop-filter:none;-webkit-backdrop-filter:none;background:radial-gradient(ellipse at center,rgba(8,8,20,.25),rgba(4,4,10,.6))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px 34px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);max-width:min(94vw,760px);max-height:92vh;overflow:auto;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.card h2{margin:0 0 6px;font-size:28px;letter-spacing:.04em}
.card .sub{color:var(--muted);margin:0 0 18px}
.eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--b);font-weight:700}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(-30px) rotate(-3deg)}to{opacity:1;transform:rotate(-1deg)}}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:var(--bg);z-index:100;transition:opacity .6s}
#loading img{width:min(560px,80vw)}
#loading .bar{width:280px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--a),var(--b));animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
#loading p{color:var(--muted);letter-spacing:.2em;font-size:12px;text-transform:uppercase}
#startgate{display:none}

/* ---------- title ---------- */
#title{position:fixed;inset:0;display:flex;align-items:center;padding:0 7vw;background:linear-gradient(90deg,rgba(5,5,14,.92) 0%,rgba(5,5,14,.6) 38%,rgba(5,5,14,0) 65%);z-index:20}
#title .inner{max-width:520px;animation:fadein .8s ease}
#title img.logo{width:min(380px,70vw);display:block;margin-bottom:6px}
#title h1{font-size:clamp(40px,6vw,76px);line-height:.95;margin:6px 0 10px;font-weight:850;letter-spacing:.02em;background:linear-gradient(135deg,#fff 30%,color-mix(in srgb,var(--a) 70%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
#title .tag{color:var(--muted);font-size:18px;margin:0 0 28px}
#title .menu{display:flex;flex-direction:column;gap:10px;max-width:320px}
#title .menu .btn{text-align:left;display:flex;justify-content:space-between;align-items:center}
#title .stats{margin-top:22px;color:var(--muted);font-size:13px;line-height:1.6}
#title .stats b{color:var(--text)}
#title .foot{position:fixed;bottom:18px;left:7vw;color:rgba(160,170,200,.5);font-size:12px;letter-spacing:.05em}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;pointer-events:none;z-index:10}
#hud .pill{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px 14px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(8px);box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
#hud .lbl{font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;font-weight:700}
#hud .val{font-size:18px;font-weight:750;font-variant-numeric:tabular-nums}
#hud .mid{display:flex;flex-direction:column;align-items:center;gap:6px}
#timer .val{font-family:var(--mono);font-size:22px}
#timer.over .val{color:#fdba74}
#timer .par{font-size:12px;color:var(--muted);font-family:var(--mono)}
#money .val{color:var(--gold)}
#rankchip{display:flex;flex-direction:column;gap:5px;min-width:160px}
#rankchip .name{font-size:13px;font-weight:700}
.xpbar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .8s cubic-bezier(.2,.8,.2,1)}
#flow{position:fixed;top:78px;right:18px;text-align:right;z-index:10;pointer-events:none;transition:opacity .3s}
#flow .n{font-size:34px;font-weight:900;font-style:italic;padding-right:8px;letter-spacing:.02em;background:linear-gradient(135deg,#fff,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px color-mix(in srgb,var(--b) 60%,transparent))}
#flow .t{font-size:11px;letter-spacing:.25em;color:var(--muted);font-weight:700}
#flow .meter{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.08);margin:6px 0 0 auto;overflow:hidden}
#flow .meter i{display:block;height:100%;background:var(--b);width:0}
#flow.bump .n{animation:bump .3s ease}
@keyframes bump{0%{transform:scale(1.4)}100%{transform:scale(1)}}
#hudbtns{display:flex;gap:8px}
#hudbtns .btn{pointer-events:auto;padding:9px 12px}

/* ---------- ticket ---------- */
#ticket{position:fixed;left:16px;top:84px;width:262px;z-index:9;background:#f6f3ea;color:#1d1a16;border-radius:6px 6px 2px 2px;padding:16px 16px 18px;font-family:var(--mono);font-size:12.5px;box-shadow:0 18px 40px -12px rgba(0,0,0,.7);transform:rotate(-1deg);animation:slidein .45s cubic-bezier(.2,1.3,.4,1);transition:transform .35s,opacity .35s}
#ticket::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(-45deg,transparent 6px,#f6f3ea 0) 0 0/12px 8px,linear-gradient(45deg,transparent 6px,#f6f3ea 0) 0 0/12px 8px}
#ticket.collapsed{transform:translateX(-300px) rotate(-6deg);opacity:0}
#ticket .hd{display:flex;align-items:center;gap:8px;border-bottom:2px dashed #cfc8b6;padding-bottom:8px;margin-bottom:8px}
#ticket .hd img{width:28px;height:28px}
#ticket .hd b{font-family:var(--font);font-size:12px;letter-spacing:.12em}
#ticket .no{font-size:15px;font-weight:800}
#ticket .tier{display:inline-block;font-family:var(--font);font-weight:800;font-size:10px;letter-spacing:.14em;padding:3px 8px;border-radius:20px;color:#fff;margin:4px 4px 0 0}
#ticket .note{font-style:italic;color:#5c5546;margin:8px 0;font-family:var(--font);font-size:12px;line-height:1.35}
#ticket table{width:100%;border-collapse:collapse;margin-top:4px}
#ticket td{padding:3px 0;vertical-align:top}
#ticket td.k{color:#6b6352;width:76px}
#ticket td.v{font-weight:700}
#ticket td.s{width:20px;text-align:right;font-weight:900}
#ticket tr.ok td.s{color:#16a34a}
#ticket tr.ok td.v{text-decoration:line-through;text-decoration-color:rgba(22,163,74,.6);text-decoration-thickness:2px}
#ticket tr.bad td.s{color:#dc2626}
#ticket tr.bad{background:rgba(220,38,38,.12)}
#ticket tr.flash{animation:flash .5s}
@keyframes flash{0%{background:rgba(250,204,21,.6)}100%{background:transparent}}
#ticket .sep{border-top:2px dashed #cfc8b6;margin:8px 0}
#ticket .extra{font-size:12px;line-height:1.6}
#ticket .extra b{font-weight:800}
#ticket .swatch{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:4px;border:1px solid rgba(0,0,0,.3)}
#ticket .foot{display:flex;justify-content:space-between;font-weight:800;margin-top:6px}

/* ---------- prompt / toasts / tooltip ---------- */
#prompt{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:10;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:12px 20px 12px 16px;border-radius:40px;font-size:15px;font-weight:600;display:flex;gap:12px;align-items:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.6);max-width:min(92vw,820px);transition:opacity .2s}
#prompt .dot{width:10px;height:10px;border-radius:50%;background:var(--b);box-shadow:0 0 12px var(--b);flex:none;animation:pulse 1.2s infinite}
#prompt.warn .dot{background:var(--bad);box-shadow:0 0 12px var(--bad)}
#prompt .kbd{margin-left:6px}
@keyframes pulse{50%{transform:scale(.6);opacity:.6}}
#toasts{position:fixed;top:86px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:12;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;animation:pop .3s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 30px -10px rgba(0,0,0,.7)}
.toast.warn{border-color:rgba(248,113,113,.5);color:#fecaca}
.toast.good{border-color:rgba(74,222,128,.5);color:#bbf7d0}
.toast.out{opacity:0;transform:translateY(-8px);transition:all .3s}
#tooltip{position:fixed;z-index:15;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 13px;min-width:150px;box-shadow:0 12px 30px -10px rgba(0,0,0,.7)}
#tooltip .c{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800}
#tooltip .t{font-size:15px;font-weight:750;margin-top:2px}
#tooltip .s{font-size:12px;color:var(--muted);margin-top:1px}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:11;overflow:hidden}
.floater{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:22px;font-style:italic;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 18px var(--b);animation:floatup 1.3s cubic-bezier(.2,.8,.3,1) forwards;white-space:nowrap}
.floater.bad{color:#fecaca;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 18px #ef4444}
.floater.gold{color:#fde68a;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 18px #f59e0b}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}30%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-190%) scale(.95)}}

/* ---------- RGB picker ---------- */
#rgbpick{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:14;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 20px;text-align:center;animation:pop .3s}
#rgbpick .sw{display:flex;gap:10px;justify-content:center;margin-top:10px}
#rgbpick button{width:52px;height:52px;border-radius:14px;border:2px solid rgba(255,255,255,.15);cursor:pointer;transition:transform .12s;position:relative}
#rgbpick button:hover{transform:translateY(-3px) scale(1.06)}
#rgbpick button span{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
#rgbpick .ttl{font-weight:750}
#rgbpick .wrong{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- results ---------- */
.stars{font-size:58px;letter-spacing:8px;margin:6px 0 4px;text-align:center}
.stars span{display:inline-block;color:rgba(255,255,255,.12);transform:scale(.6);transition:all .35s cubic-bezier(.2,1.6,.4,1)}
.stars span.on{color:var(--gold);transform:scale(1);text-shadow:0 0 22px rgba(250,204,21,.7)}
.breakdown{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
.breakdown td{padding:7px 0;border-bottom:1px solid var(--line)}
.breakdown td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.breakdown tr{opacity:0;transform:translateY(6px);transition:all .3s}
.breakdown tr.in{opacity:1;transform:none}
.breakdown .neg td:last-child{color:var(--bad)}
.breakdown .pos td:last-child{color:var(--good)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.total .amt{font-size:40px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.xpline{margin-top:14px;font-size:13px;color:var(--muted)}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.statgrid div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.statgrid b{display:block;font-size:24px}
.statgrid span{font-size:11px;letter-spacing:.15em;color:var(--muted);text-transform:uppercase}

/* ---------- workshop ---------- */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:14px 0}
.item{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.item .ic{font-size:28px}
.item .nm{font-weight:750}
.item .ds{font-size:12.5px;color:var(--muted);flex:1;line-height:1.4}
.item.owned{border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.06)}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.theme{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font-size:13px;font-weight:650;color:var(--text)}
.theme i{width:22px;height:22px;border-radius:7px;display:block}
.theme.sel{border-color:var(--a);box-shadow:0 0 0 2px var(--a) inset}
.theme small{color:var(--gold)}

/* ---------- settings ---------- */
.set{display:grid;grid-template-columns:140px 1fr 50px;gap:12px;align-items:center;margin:10px 0}
.set input[type=range]{width:100%;accent-color:var(--a)}
.set select{background:#14162a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-family:var(--font)}
.toggle{accent-color:var(--a);width:18px;height:18px}
.howto ol{padding-left:20px;line-height:1.7;color:#d6d9ee}
.howto li b{color:#fff}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.cert{background:linear-gradient(135deg,#1b1438,#0c1730);border:2px solid rgba(250,204,21,.5);border-radius:18px;padding:30px;text-align:center;position:relative}
.cert h3{font-family:Georgia,serif;font-style:italic;font-size:34px;margin:8px 0;color:#fde68a}
.credits p{color:#cdd2ea;line-height:1.6}
#paused-badge{position:fixed;inset:0;z-index:25}
@media (max-height:780px){
  #title img.logo{width:280px}
  #title h1{font-size:clamp(36px,5vw,58px);margin:4px 0 6px}
  #title .tag{font-size:15px;margin-bottom:16px}
  #title .menu{gap:8px}
  #title .menu .btn{padding:9px 16px}
  .btn.big{font-size:16px;padding:12px 22px}
  .card{padding:20px 26px;border-radius:18px}
  .card h2{font-size:23px}
  .card .sub{margin-bottom:10px}
  .stars{font-size:40px;margin:0}
  .breakdown{margin:8px 0;font-size:14px}
  .breakdown td{padding:4px 0}
  .total .amt{font-size:30px}
  .statgrid{margin:10px 0}
  #ticket{top:76px;font-size:11.5px;padding:12px 13px 14px}
  #ticket .note{margin:5px 0}
}
@media (max-height:620px){
  #title .stats,#title .foot,#title .eyebrow{display:none}
  #title img.logo{width:220px}
  #title h1{font-size:40px}
  .shopgrid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .item .ds{font-size:11.5px}
}
@media (max-width:900px){#ticket{width:220px;font-size:11.5px}#rankchip{min-width:110px}.statgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="loading"><img id="loadlogo" alt="Andromeda Insights"><div class="bar"><i></i></div><p>Assembling the workshop…</p></div>
<div id="ui">
  <div id="floaters" class="passthru"></div>
  <div id="hud" class="hidden passthru">
    <div class="row">
      <div class="pill" id="daypill"><div><div class="lbl">Shift</div><div class="val" id="dayval">Day 1</div></div><div><div class="lbl">Order</div><div class="val" id="ordval">1/3</div></div></div>
      <div id="hudbtns"><button class="btn small" id="hb-pause" title="Pause (Esc)">❚❚</button><button class="btn small" id="hb-hint" title="Hint (H)">?</button></div>
    </div>
    <div class="pill mid" id="timer"><div class="val" id="timeval">00:00</div><div class="par" id="parval">PAR 02:00</div></div>
    <div class="row">
      <div class="pill" id="money"><div><div class="lbl">Wallet</div><div class="val" id="moneyval">$0</div></div></div>
      <div class="pill" id="rankpill"><div id="rankchip"><div class="lbl" id="ranklvl">Rank 1</div><div class="name" id="rankname">Trainee</div><div class="xpbar"><i id="xpfill"></i></div></div></div>
    </div>
  </div>
  <div id="flow" class="hidden passthru"><div class="t">FLOW</div><div class="n" id="flown">×1</div><div class="meter"><i id="flowm"></i></div></div>
  <div id="ticket" class="hidden passthru"></div>
  <div id="prompt" class="hidden passthru"><div class="dot"></div><span id="prompttxt"></span></div>
  <div id="toasts" class="passthru"></div>
  <div id="tooltip" class="hidden passthru"></div>
  <div id="rgbpick" class="hidden"></div>
  <div id="title" class="hidden"></div>
  <div id="modal"></div>
</div>
<!--SCRIPT-->
</body>
</html>
