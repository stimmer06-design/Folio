:root{
  --bg:#05060c; --panel:rgba(8,12,24,.78); --panel2:rgba(12,16,32,.92); --line:rgba(160,190,255,.14); --line2:rgba(160,190,255,.28);
  --text:#eef2ff; --muted:#93a0c4; --a:#8b5cf6; --b:#22d3ee; --good:#4ade80; --bad:#f87171; --gold:#facc15;
  --font:"Inter","Segoe UI",system-ui,sans-serif; --disp:"Rajdhani","Segoe UI",system-ui,sans-serif; --mono:Consolas,"Cascadia Mono","Courier New",monospace;
  --cut:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
  --cut-s:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hidden{display:none!important}
button{font-family:var(--font)}
#ui{position:fixed;inset:0;pointer-events:none}
#ui > *{pointer-events:auto}
#ui > .passthru{pointer-events:none}
.disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-weight:700}

/* ---------- panels & buttons ---------- */
.panel{background:linear-gradient(160deg,rgba(14,20,40,.86),rgba(6,8,18,.86));border:1px solid var(--line);clip-path:var(--cut);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);position:relative}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--b),transparent 30%) top left/100% 1px no-repeat,linear-gradient(0deg,var(--b),transparent 40%) bottom right/1px 100% no-repeat;opacity:.7}
.btn{appearance:none;border:1px solid var(--line2);background:rgba(120,150,255,.07);color:var(--text);padding:12px 22px;font-family:var(--disp);font-size:17px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;clip-path:var(--cut-s);transition:transform .12s,background .15s,border-color .15s,box-shadow .2s,color .15s;position:relative}
.btn:hover{background:rgba(120,150,255,.16);border-color:var(--b);transform:translateX(3px)}
.btn:active{transform:translateX(3px) scale(.98)}
.btn.primary{background:var(--a);background:linear-gradient(110deg,var(--a),color-mix(in srgb,var(--a) 50%,var(--b)));border-color:transparent;color:#fff;box-shadow:0 0 30px -6px var(--a)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.big{font-size:21px;padding:16px 30px}
.btn.small{font-size:14px;padding:8px 14px}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.kbd{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 6px;border:1px solid var(--line2);background:rgba(255,255,255,.06);color:var(--muted);border-radius:3px;letter-spacing:0;text-transform:none;font-weight:600}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(6,8,22,.5),rgba(2,3,8,.88));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:30;animation:fadein .25s ease}
.overlay.clear{backdrop-filter:none;-webkit-backdrop-filter:none;background:radial-gradient(ellipse at center,rgba(6,8,22,.2),rgba(2,3,8,.6))}
.card{background:linear-gradient(160deg,rgba(14,20,42,.94),rgba(6,8,18,.95));border:1px solid var(--line2);clip-path:var(--cut);padding:28px 34px;max-width:min(94vw,780px);max-height:92vh;overflow:auto;animation:pop .35s cubic-bezier(.2,1.3,.4,1);position:relative}
.card::after{content:"";position:absolute;top:0;left:12px;right:30%;height:2px;background:linear-gradient(90deg,var(--b),transparent)}
.card h2{margin:0 0 6px;font-family:var(--disp);font-size:34px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.card .sub{color:var(--muted);margin:6px 0 18px;line-height:1.5}
.overlay.shop .card,.overlay.codex .card{max-width:min(96vw,1080px)}
.eyebrow{font-family:var(--disp);font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--b);font-weight:700}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:#03040a;z-index:100;transition:opacity .7s}
#loading img{width:min(560px,80vw)}
#loading .bar{width:300px;height:2px;background:rgba(255,255,255,.08);overflow:hidden}
#loading .bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--a),var(--b));animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
#loading p{color:var(--muted);letter-spacing:.3em;font-size:12px;text-transform:uppercase;font-family:var(--disp)}

/* ---------- title ---------- */
#title{position:fixed;inset:0;display:flex;align-items:center;padding:0 6vw;background:linear-gradient(90deg,rgba(3,4,12,.94) 0%,rgba(3,4,12,.7) 34%,rgba(3,4,12,0) 62%);z-index:20}
#title .inner{max-width:560px;animation:slidein .9s cubic-bezier(.2,1,.3,1)}
#title img.logo{width:min(340px,70vw);display:block;margin-bottom:4px}
#title h1{font-family:var(--disp);font-size:clamp(52px,7.5vw,104px);line-height:.82;margin:8px 0 6px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;background:linear-gradient(180deg,#fff 30%,color-mix(in srgb,var(--a) 60%,#fff) 70%,var(--a));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px color-mix(in srgb,var(--a) 50%,transparent))}
#title .tag{color:var(--muted);font-size:16px;margin:10px 0 26px;line-height:1.5;max-width:440px}
#title .tag b{color:var(--text)}
#title .menu{display:flex;flex-direction:column;gap:8px;max-width:340px}
#title .menu .btn{text-align:left;display:flex;justify-content:space-between;align-items:center}
#title .stats{margin-top:20px;display:flex;gap:18px;color:var(--muted);font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-family:var(--disp);font-weight:700}
#title .stats b{display:block;color:var(--text);font-size:22px;letter-spacing:.04em}
#title .foot{position:fixed;bottom:16px;left:6vw;color:rgba(160,170,200,.45);font-size:11px;letter-spacing:.1em}
#title .chap{display:inline-block;margin-top:2px;padding:4px 10px;border:1px solid var(--line2);font-family:var(--disp);font-weight:700;letter-spacing:.2em;font-size:13px;color:var(--gold);clip-path:var(--cut-s)}

/* ---------- HUD ---------- */
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:14px 18px;pointer-events:none;z-index:10}
#hud .pill{pointer-events:auto;padding:8px 14px;display:flex;align-items:center;gap:14px}
#hud .lbl{font-family:var(--disp);font-size:11px;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;font-weight:700}
#hud .val{font-family:var(--disp);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;line-height:1.05}
#hud .mid{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:180px}
#timer .val{font-size:30px}
#timer.over .val{color:#fdba74}
#timer .par{font-size:12px;color:var(--muted);font-family:var(--disp);letter-spacing:.2em;font-weight:700}
#timer .pbar{width:150px;height:3px;background:rgba(255,255,255,.08)}
#timer .pbar i{display:block;height:100%;width:0;background:var(--b);transition:width .2s linear}
#timer.over .pbar i{background:#fb923c}
#money .val{color:var(--gold)}
#chapval{color:var(--gold)}
#rankchip{display:flex;flex-direction:column;gap:4px;min-width:170px}
#rankchip .name{font-family:var(--disp);font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.xpbar{height:4px;background:rgba(255,255,255,.08);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .8s cubic-bezier(.2,.8,.2,1)}
#sigbar{margin-top:3px}
#sigbar .xpbar i{background:linear-gradient(90deg,#f59e0b,#f0abfc)}
#sigbar .lbl{color:#f0abfc!important}
#hudbtns{display:flex;gap:6px}
#hudbtns .btn{pointer-events:auto;padding:8px 12px}

/* overdrive meter */
#od{position:fixed;top:92px;right:18px;width:210px;z-index:10;pointer-events:none;text-align:right}
#od .n{font-family:var(--disp);font-size:54px;font-weight:700;line-height:.9;font-style:italic;color:#fff;text-shadow:0 0 22px var(--odc,var(--b))}
#od .t{font-family:var(--disp);font-size:13px;letter-spacing:.3em;color:var(--muted);font-weight:700}
#od .tier{font-family:var(--disp);font-size:18px;letter-spacing:.2em;font-weight:700;color:var(--odc,var(--b));height:22px;text-shadow:0 0 14px var(--odc,var(--b))}
#od .meter{height:6px;background:rgba(255,255,255,.08);margin:6px 0 0 auto;position:relative;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
#od .meter i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--b),var(--odc,var(--b)));width:0}
#od .ticks{display:flex;justify-content:space-between;font-family:var(--disp);font-size:10px;color:var(--muted);letter-spacing:.1em;margin-top:3px}
#od.bump .n{animation:bump .28s ease}
#od .win{height:2px;background:rgba(255,255,255,.08);margin-top:6px}
#od .win i{display:block;height:100%;background:#fff;width:0;opacity:.7}
@keyframes bump{0%{transform:scale(1.35)}100%{transform:scale(1)}}

/* contracts */
#contracts{position:fixed;top:250px;right:18px;width:240px;z-index:9;pointer-events:none;padding:10px 12px}
#contracts .hd{font-family:var(--disp);font-size:12px;letter-spacing:.3em;color:var(--b);font-weight:700;margin-bottom:6px}
#contracts .c{margin:7px 0;font-size:12px;line-height:1.3}
#contracts .c .bar{height:3px;background:rgba(255,255,255,.08);margin-top:4px}
#contracts .c .bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
#contracts .c.done{color:var(--good)}
#contracts .c.done .bar i{background:var(--good)}
#contracts .c .pr{float:right;color:var(--muted);font-family:var(--disp);font-weight:700}

/* ---------- work order ---------- */
#ticket{position:fixed;left:16px;top:86px;width:270px;z-index:9;padding:14px 16px 14px;font-size:12.5px;animation:slidein .45s cubic-bezier(.2,1.2,.4,1);transition:transform .35s,opacity .35s}
#ticket.collapsed{transform:translateX(-320px);opacity:0}
#ticket .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#ticket .hd img{width:26px;height:26px}
#ticket .hd b{font-family:var(--disp);font-size:13px;letter-spacing:.2em;color:var(--muted)}
#ticket .no{font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:.06em}
#ticket .tier{display:inline-block;font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.16em;padding:2px 8px;color:#06070d;margin:4px 4px 0 0;clip-path:var(--cut-s)}
#ticket .who{margin-top:6px;font-size:12px}
#ticket .who b{font-family:var(--disp);font-size:15px;letter-spacing:.04em}
#ticket .note{font-style:italic;color:var(--muted);margin:6px 0 8px;font-size:12px;line-height:1.4}
#ticket table{width:100%;border-collapse:collapse}
#ticket td{padding:4px 0;vertical-align:middle;border-top:1px solid rgba(160,190,255,.07)}
#ticket td.k{color:var(--muted);width:80px;font-family:var(--disp);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px}
#ticket td.v{font-weight:600}
#ticket td.s{width:22px;text-align:right;font-weight:900;font-family:var(--disp);font-size:15px}
#ticket tr.ok td.s{color:var(--good)}
#ticket tr.ok td.v{color:#bbf7d0}
#ticket tr.bad td.s,#ticket tr.bad td.v{color:var(--bad)}
#ticket tr.bad{background:rgba(248,113,113,.1)}
#ticket tr.flash{animation:flash .5s}
@keyframes flash{0%{background:rgba(34,211,238,.35)}100%{background:transparent}}
#ticket .sep{height:1px;background:var(--line);margin:8px 0}
#ticket .extra{font-size:12px;line-height:1.65;color:var(--muted)}
#ticket .extra b{color:var(--text)}
#ticket .swatch{display:inline-block;width:10px;height:10px;vertical-align:middle;margin-right:4px}
#ticket .foot{display:flex;justify-content:space-between;font-family:var(--disp);font-weight:700;letter-spacing:.12em;margin-top:6px}
#ticket .foot .pay{color:var(--gold)}

/* ---------- prompt / toasts / tooltip ---------- */
#prompt{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10;pointer-events:none;padding:12px 22px 12px 18px;font-size:15px;font-weight:600;display:flex;gap:12px;align-items:center;max-width:min(92vw,860px);transition:opacity .2s}
#prompt .dot{width:9px;height:9px;background:var(--b);box-shadow:0 0 12px var(--b);flex:none;transform:rotate(45deg);animation:pulse 1.2s infinite}
#prompt.warn .dot{background:var(--bad);box-shadow:0 0 12px var(--bad)}
@keyframes pulse{50%{opacity:.4}}
#toasts{position:fixed;top:92px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:12;pointer-events:none}
.toast{padding:10px 18px;font-size:14px;font-weight:600;animation:pop .3s cubic-bezier(.2,1.4,.4,1);max-width:640px;text-align:center}
.toast.warn{color:#fecaca}
.toast.good{color:#bbf7d0}
.toast.gold{color:#fde68a}
.toast.out{opacity:0;transform:translateY(-8px);transition:all .3s}
#tooltip{position:fixed;z-index:15;pointer-events:none;padding:9px 14px;min-width:160px}
#tooltip .c{font-family:var(--disp);font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700}
#tooltip .t{font-family:var(--disp);font-size:19px;font-weight:700;letter-spacing:.04em;margin-top:1px}
#tooltip .s{font-size:12px;color:var(--muted);margin-top:1px}

/* ---------- judgements & floaters ---------- */
#floaters{position:fixed;inset:0;pointer-events:none;z-index:11;overflow:hidden}
.floater{position:absolute;transform:translate(-50%,-50%);font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.08em;color:#fff;text-shadow:0 0 16px var(--b);animation:floatup 1.3s cubic-bezier(.2,.8,.3,1) forwards;white-space:nowrap}
.floater.bad{color:#fecaca;text-shadow:0 0 16px #ef4444}
.floater.gold{color:#fde68a;text-shadow:0 0 16px #f59e0b}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-190%)}}
.judge{position:absolute;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;animation:judge 1.25s cubic-bezier(.2,.9,.3,1) forwards}
.judge b{display:block;font-family:var(--disp);font-weight:700;font-style:italic;font-size:44px;letter-spacing:.06em;line-height:.9}
.judge i{display:block;font-style:normal;font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.18em;margin-top:2px;opacity:.9}
.judge.perfect b{background:linear-gradient(180deg,#fff,#fde68a 45%,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(250,204,21,.8)) drop-shadow(2px 0 0 rgba(236,72,153,.6)) drop-shadow(-2px 0 0 rgba(34,211,238,.6));font-size:56px}
.judge.perfect i{color:#fde68a}
.judge.great b{color:#a5f3fc;text-shadow:0 0 16px rgba(34,211,238,.8)}
.judge.great i{color:#a5f3fc}
.judge.good b{color:#e9d5ff;font-size:36px;text-shadow:0 0 12px rgba(168,85,247,.7)}
.judge.sloppy b{color:#fca5a5;font-size:32px;text-shadow:0 0 12px rgba(239,68,68,.7)}
.judge.wrong b{color:#f87171;font-size:40px;text-shadow:0 0 16px rgba(239,68,68,.9)}
@keyframes judge{0%{opacity:0;transform:translate(-50%,-30%) scale(1.8)}12%{opacity:1;transform:translate(-50%,-55%) scale(.92)}22%{transform:translate(-50%,-60%) scale(1.04)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}

/* overdrive banner */
#odbanner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:13;pointer-events:none;font-family:var(--disp);font-weight:700;font-style:italic;font-size:86px;letter-spacing:.08em;white-space:nowrap;color:#fff;text-shadow:0 0 40px var(--odc,var(--b)),0 0 80px var(--odc,var(--b))}
#odbanner.go{animation:odb 1.4s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes odb{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4) skewX(-12deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(1) skewX(-12deg)}75%{opacity:1;transform:translate(-50%,-50%) scale(1.04) skewX(-12deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1) skewX(-12deg);letter-spacing:.4em}}

/* gauge */
#gauge{position:fixed;z-index:14;pointer-events:none;transform:translate(-50%,-50%)}
#gauge .lb{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-family:var(--disp);font-weight:700;letter-spacing:.3em;font-size:12px;color:var(--muted);margin-top:-6px}

/* transmissions */
#tx{position:fixed;left:18px;bottom:86px;width:min(560px,46vw);z-index:16;display:flex;gap:14px;padding:14px 16px;align-items:flex-start;animation:slidein .35s cubic-bezier(.2,1.2,.4,1);pointer-events:auto;cursor:pointer}
#tx.bark{pointer-events:none;width:min(420px,40vw);padding:10px 12px}
#tx img{width:64px;height:64px;flex:none;border:1px solid var(--line2)}
#tx.bark img{width:44px;height:44px}
#tx .nm{font-family:var(--disp);font-weight:700;letter-spacing:.14em;font-size:16px;text-transform:uppercase}
#tx .rl{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-family:var(--disp);font-weight:700}
#tx .msg{margin-top:5px;font-size:15px;line-height:1.45;min-height:22px}
#tx.bark .msg{font-size:13px}
#tx .more{position:absolute;right:12px;bottom:8px;font-size:11px;color:var(--muted);font-family:var(--disp);letter-spacing:.2em;font-weight:700}
#txdim{position:fixed;inset:0;z-index:15;background:linear-gradient(0deg,rgba(2,3,8,.75),rgba(2,3,8,.2) 60%);pointer-events:auto}

/* RGB picker */
#rgbpick{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:14;padding:16px 22px;text-align:center;animation:pop .3s}
#rgbpick .sw{display:flex;gap:10px;justify-content:center;margin-top:12px}
#rgbpick button{width:54px;height:54px;border:2px solid rgba(255,255,255,.15);cursor:pointer;transition:transform .12s;position:relative;clip-path:var(--cut-s)}
#rgbpick button:hover{transform:translateY(-3px) scale(1.06)}
#rgbpick .ttl{font-weight:600}
#rgbpick .wrong{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* ---------- results ---------- */
.res{display:grid;grid-template-columns:200px 1fr;gap:26px;align-items:start}
.grade{font-family:var(--disp);font-weight:700;font-size:190px;line-height:.8;text-align:center;font-style:italic;opacity:0;transform:scale(3)}
.grade.slam{animation:slam .55s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes slam{0%{opacity:0;transform:scale(3) rotate(-8deg)}60%{opacity:1;transform:scale(.9) rotate(2deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.gname{font-family:var(--disp);font-weight:700;letter-spacing:.35em;text-align:center;font-size:18px;margin-top:6px}
.breakdown{width:100%;border-collapse:collapse;font-size:14px}
.breakdown td{padding:6px 0;border-bottom:1px solid var(--line)}
.breakdown td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-family:var(--disp);font-size:17px;letter-spacing:.04em}
.breakdown tr{opacity:0;transform:translateX(-8px);transition:all .25s}
.breakdown tr.in{opacity:1;transform:none}
.breakdown .neg td:last-child{color:var(--bad)}
.breakdown .pos td:last-child{color:var(--good)}
.breakdown .mul td:last-child{color:var(--gold)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.total .amt{font-family:var(--disp);font-size:46px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(250,204,21,.4)}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
.meters .xpbar{height:6px;margin-top:5px}
.meters .sig i{background:linear-gradient(90deg,#f59e0b,#f0abfc)}
.review{margin-top:14px;padding:10px 14px;border-left:3px solid var(--gold);background:rgba(250,204,21,.06);font-size:13px;line-height:1.45;opacity:0;transition:opacity .4s}
.review.in{opacity:1}
.review .st{color:var(--gold);letter-spacing:3px}
.miniStats{display:flex;gap:14px;margin:4px 0 12px;font-family:var(--disp);font-weight:700;letter-spacing:.1em;font-size:13px;color:var(--muted);flex-wrap:wrap}
.miniStats b{color:var(--text);font-size:18px}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.statgrid div{background:rgba(120,150,255,.05);border:1px solid var(--line);padding:14px;text-align:center;clip-path:var(--cut-s)}
.statgrid b{display:block;font-family:var(--disp);font-size:28px}
.statgrid span{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;font-family:var(--disp);font-weight:700}

/* crate */
.crateWrap{text-align:center;padding:10px 20px}
.crate{width:180px;height:150px;margin:20px auto 10px;position:relative;cursor:pointer}
.crate .box{position:absolute;inset:0;background:linear-gradient(160deg,#2a2f3d,#14171f);border:2px solid var(--rc);clip-path:polygon(10% 0,90% 0,100% 15%,100% 100%,0 100%,0 15%);box-shadow:inset 0 0 40px color-mix(in srgb,var(--rc) 40%,transparent)}
.crate .box::before{content:"";position:absolute;left:0;right:0;top:38%;height:10px;background:var(--rc);opacity:.85}
.crate .box::after{content:"◈";position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-size:40px;color:var(--rc);text-shadow:0 0 18px var(--rc)}
.crate.shake{animation:cshake .5s infinite}
@keyframes cshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) scale(1.02)}75%{transform:rotate(3deg) scale(1.02)}}
.crate.open{animation:copen .5s forwards}
@keyframes copen{to{transform:scale(1.6);opacity:0}}
.rays{position:absolute;left:50%;top:50%;width:520px;height:520px;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 45%,transparent) 0deg 8deg,transparent 8deg 22deg);border-radius:50%;mask:radial-gradient(circle,#000 20%,transparent 68%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 8s linear infinite;pointer-events:none;opacity:0;transition:opacity .4s}
.rays.on{opacity:1}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.loot{position:relative;margin:0 auto;max-width:420px;padding:20px;border:1px solid var(--rc);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 22%,#0a0d18),#070912);clip-path:var(--cut);animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.loot .r{font-family:var(--disp);font-weight:700;letter-spacing:.35em;color:var(--rc);font-size:14px}
.loot .nm{font-family:var(--disp);font-weight:700;font-size:32px;letter-spacing:.04em;margin:4px 0}
.loot .ds{color:var(--muted);font-size:14px}
.loot .ic{font-size:44px;margin-bottom:4px}

/* shop / codex */
.tabs{display:flex;gap:6px;margin:10px 0 4px}
.tabs .btn{font-size:14px;padding:8px 16px}
.tabs .btn.on{border-color:var(--b);background:rgba(34,211,238,.12)}
.shopgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
@media (max-width:1000px){.shopgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.item{background:rgba(120,150,255,.04);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:7px;clip-path:var(--cut-s)}
.item .ic{font-size:26px}
.item .nm{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.04em}
.item .ds{font-size:12px;color:var(--muted);flex:1;line-height:1.4}
.item.owned{border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.05)}
.item.locked{opacity:.45}
.item .rar{font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.25em}
.themes{display:flex;gap:10px;flex-wrap:wrap}
.theme{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font-family:var(--disp);font-weight:700;letter-spacing:.06em;font-size:15px;color:var(--text);clip-path:var(--cut-s)}
.theme i{width:22px;height:22px;display:block}
.theme.sel{border-color:var(--a);box-shadow:0 0 0 2px var(--a) inset}
.theme small{color:var(--gold)}
.theme.lock{opacity:.4;cursor:not-allowed}
.codex{display:grid;grid-template-columns:260px 1fr;gap:20px;min-height:380px}
.codex .list{border-right:1px solid var(--line);padding-right:12px;max-height:60vh;overflow:auto}
.codex .cat{font-family:var(--disp);font-weight:700;letter-spacing:.3em;font-size:12px;color:var(--b);margin:12px 0 4px}
.codex .ent{padding:7px 10px;cursor:pointer;font-size:14px;border-left:2px solid transparent}
.codex .ent:hover{background:rgba(255,255,255,.04)}
.codex .ent.on{border-color:var(--b);background:rgba(34,211,238,.08)}
.codex .ent.lk{color:#4b5470;cursor:default}
.codex .body h3{font-family:var(--disp);font-size:30px;letter-spacing:.05em;margin:4px 0 10px;text-transform:uppercase}
.codex .body p{line-height:1.7;color:#d3d9f0;font-size:15px}

/* settings etc */
.set{display:grid;grid-template-columns:150px 1fr 50px;gap:12px;align-items:center;margin:10px 0}
.set label{font-family:var(--disp);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.set input[type=range]{width:100%;accent-color:var(--a)}
.set select{background:#0e1224;color:var(--text);border:1px solid var(--line2);padding:7px 10px;font-family:var(--font)}
.toggle{accent-color:var(--a);width:18px;height:18px}
.howto ol{padding-left:20px;line-height:1.7;color:#d6dbf0;font-size:14.5px}
.howto li b{color:#fff}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.cert{background:linear-gradient(135deg,#1b1438,#0c1730);border:2px solid rgba(250,204,21,.5);padding:30px;text-align:center;clip-path:var(--cut)}
.cert h3{font-family:var(--disp);font-size:44px;letter-spacing:.06em;margin:8px 0;color:#fde68a;text-transform:uppercase}
.credits p{color:#cdd2ea;line-height:1.6}
@media (max-height:780px){
  #title img.logo{width:260px}
  #title h1{font-size:clamp(44px,6vw,80px)}
  #title .tag{font-size:14px;margin-bottom:16px}
  #title .menu{gap:6px}
  #title .menu .btn{padding:9px 18px}
  .btn.big{font-size:18px;padding:12px 22px}
  .card{padding:20px 26px}
  .card h2{font-size:28px}
  .grade{font-size:150px}
  .res{grid-template-columns:160px 1fr}
  .breakdown td{padding:4px 0}
  .total .amt{font-size:36px}
  #ticket{top:76px;font-size:11.5px;padding:10px 13px}
  #contracts{top:236px}
}
@media (max-height:620px){
  .grade{font-size:110px}
  .breakdown{font-size:12.5px}
  .meters{margin-top:6px}
  .review{margin-top:8px;padding:6px 10px}
  #title .stats,#title .foot{display:none}
  #title h1{font-size:44px}
  #contracts{display:none}
}
@media (max-width:1000px){#ticket{width:230px;font-size:11.5px}#rankchip{min-width:120px}.statgrid{grid-template-columns:repeat(2,1fr)}.res{grid-template-columns:130px 1fr;gap:16px}.grade{font-size:110px}#contracts{display:none}}
@media (max-width:720px){.res{grid-template-columns:1fr}}
</style>

st:["Go big or go home. Home is a hab module, so: go big.","Benchmarks or it didn't happen.","Sim-racing rig for the Olympus league finals.","Max settings. All of them. In zero-g."],workstation:["Listening post on Triton \u2014 we need to process array data.","Rendering the planetarium show for the Luna museum.","Machine-learning crop models for Mars terraforming.","Our observatory keeps hearing\u2026 something. Need more compute."],lighthouse:["This is it. Build it like the galaxy is listening \u2014 because it is."]},rp={S:["Opened the box and actually teared up. Flawless.","Cable management so clean I framed a photo of it.","Benchmarks off the charts. Who built this? Give them a raise.","Perfect. Ten stars. The crate smelled like starlight."],A:["Gorgeous build, booted first try. Love the card!","Runs cool and quiet even in the dome heatwave.","Fast shipping all the way to the belt. Impressed."],B:["Solid machine. Does exactly what I need.","Works great. Tape was a little wonky, but who cares!","Good build, arrived safely past the asteroid fields."],C:["It works. Box looked like it fought a meteor.","Took a bit to get set up but it runs fine."],D:["It boots\u2026 eventually. I've seen tidier hab modules.","Arrived. Functional. ORIN would not be proud."]};var Tc={orin:{name:"ORIN",role:"Forge-7 Foreman AI",color:"#22d3ee",glyph:"eye"},sela:{name:"Director Sela Okafor",role:"Station Director",color:"#a78bfa",glyph:"face"},juno:{name:"Juno Reyes",role:"Dispatch & Launch",color:"#f59e0b",glyph:"face2"},marrow:{name:"Dr. Ilya Marrow",role:"Founder \xB7 archived log",color:"#f0abfc",glyph:"archive"},whisper:{name:"\u2014 UNKNOWN \u2014",role:"Source: M31 \xB7 2.5 Mly",color:"#facc15",glyph:"signal"}},xu=[{n:1,title:"First Shift",ranks:[1,2]},{n:2,title:"The Whisper",ranks:[3,4]},{n:3,title:"Static",ranks:[5,6]},{n:4,title:"Resonance",ranks:[7,8]},{n:5,title:"The Lighthouse",ranks:[9,10]}];function eo(s){return xu.find(e=>s>=e.ranks[0]&&s<=e.ranks[1])||xu[xu.length-1]}var Ke=(s,e)=>({who:s,text:e}),ap={intro:[Ke("orin","Boot sequence complete. Hello, Builder. I am ORIN, foreman intelligence of Forge-7."),Ke("orin","You are standing in the finest hand-build foundry in the Sol system. Please do not lick anything."),Ke("sela","Welcome aboard. Every colony from Mercury to Triton runs on machines built at this bench. Now one of them will be yours."),Ke("sela","Read the work order, build it right, build it fast. ORIN will keep score. He loves keeping score."),Ke("orin",'I do not "love" anything. I simply find perfect torque values\u2026 deeply satisfying.')],firstShip:[Ke("juno","WOO! Did you see that pod go? Juno here \u2014 I run dispatch. Your first machine is on its way to the colonies!"),Ke("juno","Every box you seal goes out that airlock on a launch pod. Seal them neat and the customers leave the best reviews."),Ke("orin","Your work has been logged. Supply crate attached. Statistically, builders who open crates are 40% happier.")],rank2:[Ke("sela","Promotion paperwork is through \u2014 congratulations, Builder. Gaming rigs are coming your way."),Ke("orin","Warning: the fabricators have started printing look-alike parts on the pads. Read the order. Every line.")],rank3:[Ke("orin","Builder. Something unusual. The deep-space array registered a structured pulse at 21 centimetres."),Ke("sela","Source triangulates to M31 \u2014 the Andromeda Galaxy. Two and a half million light-years out. And it repeats."),Ke("whisper","\xB7\xB7 \xB7\xB7\xB7 \xB7  \xB7\xB7 \xB7\xB7  \xB7\xB7\xB7  \xB7  \xB7\xB7 \xB7\xB7\xB7 \xB7"),Ke("sela","It is far too faint to decode with the array alone. But we have something nobody else has."),Ke("orin","The Lighthouse Network. Every Andromeda machine you ship can donate idle cycles. Every build helps us listen.")],rank4:[Ke("juno","Custom RGB requests are flooding in. Turns out colonists like their PCs the colour of their home sky."),Ke("orin","Decode progress is now displayed on your HUD. Build well. The quality of each machine improves its contribution.")],rank5:[Ke("sela","The fragments are getting cleaner. The first block decoded as prime numbers. Somebody out there counts like we do."),Ke("orin",'Market note: Nullcore has launched mass-printed "instant" PCs. Failure rate: 31%. Customers are returning to us.'),Ke("juno","A Nullcore unit literally caught fire on Phobos. On Phobos! There is barely any oxygen on Phobos!")],rank6:[Ke("marrow","[Archive, 2219] If you are hearing this, the array finally heard something. I always believed it would."),Ke("marrow","A machine built with care is a message. Keep building them that way. Someone, somewhere, is listening for it."),Ke("sela","That is our founder. She recorded that seventy years ago. She knew.")],rank7:[Ke("orin","Observatories across the system are ordering workstations. Triton, Europa, Luna. All of them heard the Whisper."),Ke("sela","The newest fragment is a diagram. Layered. Interconnected. Builder\u2026 I think it is a circuit.")],rank8:[Ke("orin","Anomaly. When the Lighthouse Network grew past ten thousand nodes, the signal changed."),Ke("whisper","\xB7\xB7 \xB7\xB7\xB7 \xB7  RECEIVED  \xB7\xB7 \xB7\xB7\xB7"),Ke("sela","It is responding. It knows we are listening. We need a transmitter worthy of an answer.")],rank9:[Ke("sela","The array engineers have finished the plans. The core needs parts we have never fabricated. Parts from the diagram."),Ke("orin","Fabrication of the Lighthouse components has begun. When you are ready, Keeper, so are we.")],finaleOrder:[Ke("sela","This is it. The Lighthouse Core. Singularity silicon, an Event Horizon array, a Zero-Point cell."),Ke("juno","I polished the launch pod. Twice. Okay, four times."),Ke("orin","Builder. Every machine you have shipped led to this bench. Build it perfectly. I believe that you will.")],finale:[Ke("orin","The Lighthouse Core is online. Transmitting on the array\u2026 now."),Ke("whisper","WE HEARD YOUR HANDS."),Ke("whisper","WE BUILD THE SAME WAY \u2014 SLOWLY, CAREFULLY, ONE PIECE AT A TIME."),Ke("whisper","HELLO, NEIGHBOURS."),Ke("sela","\u2026Two galaxies. And the first thing they wanted to say was that they build things like we do."),Ke("orin","Lighthouse Keeper. It has been an honour to keep score for you. The orders will keep coming \u2014 the whole galaxy wants to talk now.")],sig10:[Ke("orin","Decode at 10%. The signal has rhythm. Not noise. Rhythm.")],sig25:[Ke("sela","25% decoded. Prime numbers, in order, out to 997. Someone wants us to know they are not an accident.")],sig40:[Ke("orin",'40%. The new block is a repeating geometric unit. I would call it a "brick". Or a component.')],sig55:[Ke("sela","55%. The structure stacks. Like layers of a circuit board. Like our boards.")],sig70:[Ke("orin",'70%. I have stopped categorising this as "anomalous". I now categorise it as "a letter".')],sig85:[Ke("sela","85%. The final block will not resolve without a dedicated transmitter. Keep building, Keeper.")]},op={day:[["orin","New shift. Fabricators primed. Coffee machine judged and found wanting."],["juno","Launch pods fuelled and gleaming. Let's light up the colonies!"],["orin","Reminder: perfect placements make me 3% more cheerful. Unofficially."],["sela","The array is listening. Make every machine count."],["orin","Saturn looks particularly ringed today. Begin."],["juno","Bet I can launch more pods than you can build. Kidding. You build, I launch."]],od1:[["orin","Flow detected. Efficiency rising."],["juno","Ooh, somebody's in the zone!"]],od2:[["orin","Overdrive II. Your hands are a blur. I approve."],["juno","The whole dispatch bay can hear you clicking!"]],od3:[["orin","OVERDRIVE III. I am recording this for training purposes."],["sela","Is the bench\u2026 smoking? Keep going!"]],qaFail:[["orin","QA failure. The part did not match the work order. Reading is a skill, Builder."],["orin","Incorrect component. I will pretend I did not see that."]],gradeS:[["orin","S-grade. Logging this one in the hall of fame."],["sela","That was beautiful work."],["juno","Customers are going to FRAME that box."]],perfectStreak:[["orin","Five perfects in a row. Statistically improbable. Personally delightful."]],wrong:[["orin","That part is not on the order. Check the work order panel."]]},Sn=[{id:"forge7",cat:"Station",title:"Forge-7",unlock:"intro",text:"Andromeda Insights' orbital foundry, parked in high orbit above Titan since 2268. Crew of 140 humans, one foreman AI, and an uncountable number of tiny screws. Every machine is hand-assembled at a builder bench and launched to the colonies by pod."},{id:"orin",cat:"People",title:"ORIN",unlock:"intro",text:"Operations & Reliability INtelligence. Forge-7's foreman AI. Tracks every torque value on the station. Claims not to have feelings; has a documented fondness for perfectly routed cables."},{id:"sela",cat:"People",title:"Director Sela Okafor",unlock:"intro",text:"Station director, former belt-mining engineer. Believes a good machine should outlive its owner's grandchildren. Keeps a photo of the founder on her desk."},{id:"juno",cat:"People",title:"Juno Reyes",unlock:"firstShip",text:'Dispatch & launch tech. Has named every launch pod on the station. The favourite is "Big Kevin". Big Kevin is the same size as every other pod.'},{id:"company",cat:"Station",title:"Andromeda Insights",unlock:"firstShip",text:'Founded in 2207 by Dr. Ilya Marrow, who saw the Andromeda Galaxy through a backyard telescope at age nine and decided machines should be built "like letters to someone far away". Hand-built computers for every colony in the Sol system.'},{id:"lighthouse",cat:"Signal",title:"The Lighthouse Network",unlock:"rank3",text:"An opt-in mesh of Andromeda Insights machines donating idle compute to Forge-7's deep-space array. Originally built to map the cosmic microwave background. Now it listens to something else."},{id:"whisper",cat:"Signal",title:"The Whisper",unlock:"rank3",text:"A structured 21 cm pulse from the direction of M31, first registered by the Forge-7 array in 2291. It repeats every 47 minutes. It is far too regular to be natural."},{id:"nullcore",cat:"Station",title:"Nullcore Systems",unlock:"rank5",text:'Rival manufacturer of fully automated, mass-printed PCs. Cheap, fast, and prone to "thermal events". Their slogan, "Why build when you can print?", is not aging well.'},{id:"marrow",cat:"Archive",title:"Marrow's Log, 2219",unlock:"rank6",text:`"Engineers keep asking why we don't automate the benches. Because a machine built by careful hands carries something of the builder. Call it superstition. I call it a signal."`},{id:"circuit",cat:"Signal",title:"Fragment: The Diagram",unlock:"rank7",text:"Decoded block 7 resolves into a layered, branching structure. Array engineers note an uncanny resemblance to a multilayer printed circuit board \u2014 with traces arranged for repairability, not cost."},{id:"response",cat:"Signal",title:"Fragment: Received",unlock:"rank8",text:`After the Lighthouse Network passed 10,000 nodes, the Whisper's structure changed for the first time in its observed history. The new block contains a single repeated word-equivalent. The linguists translate it as "received".`},{id:"core",cat:"Signal",title:"The Lighthouse Core",unlock:"rank9",text:"A transmitter-compute hybrid built from the decoded diagram. Requires components never before fabricated: Singularity silicon, Event Horizon array card, Pulsar Array memory, Zero-Point power cell."},{id:"hello",cat:"Signal",title:"Fragment: Hello",unlock:"finale",text:'"WE HEARD YOUR HANDS. WE BUILD THE SAME WAY \u2014 SLOWLY, CAREFULLY, ONE PIECE AT A TIME. HELLO, NEIGHBOURS." Received 2291, Forge-7 deep-space array. Reply sent by the Lighthouse Core.'},{id:"log1",cat:"Archive",title:"Marrow's Log #1",unlock:"crate",text:`"Day one of the company. Three benches, one telescope, too much coffee. Built our first machine for a librarian on Luna. She sent back a photo of it next to the window, Earth rising behind. I cried. Don't tell anyone."`},{id:"log2",cat:"Archive",title:"Marrow's Log #2",unlock:"crate",text:'"Someone asked why every box ships with a thank-you card. Because somebody waited for this machine. The least we can do is say we thought about them while we built it."'},{id:"log3",cat:"Archive",title:"Marrow's Log #3",unlock:"crate",text:`"The array picked up nothing again tonight. That's alright. Listening is not wasted time. Listening is how you're ready when someone finally speaks."`},{id:"log4",cat:"Archive",title:"Marrow's Log #4",unlock:"crate",text:`"I've asked the engineers to design an AI foreman. Requirements: patient, precise, secretly sentimental. They said the last one was impossible. I said try anyway."`},{id:"pods",cat:"Station",title:"Launch Pods",unlock:"crate",text:"Reusable courier capsules fired from Forge-7's dispatch airlock on a magnetic rail, then boosted by small ion thrusters. Average delivery time to the Martian colonies: 19 days. Pods return empty, smelling faintly of the colonies they visited."}];var Ai=(s,e,t)=>Math.max(e,Math.min(t,s)),Kx=(s,e,t)=>s+(e-s)*t,Gt=(s,e,t,i)=>Kx(s,e,1-Math.exp(-t*i)),ti=(s=0,e=1)=>s+Math.random()*(e-s),wt=s=>s[Math.floor(Math.random()*s.length)],wc=s=>{let e=s.slice();for(let t=e.length-1;t>0;t--){let i=Math.floor(Math.random()*(t+1));[e[t],e[i]]=[e[i],e[t]]}return e},yt={linear:s=>s,inQuad:s=>s*s,outQuad:s=>1-(1-s)*(1-s),inCubic:s=>s*s*s,outCubic:s=>1-Math.pow(1-s,3),inOutCubic:s=>s<.5?4*s*s*s:1-Math.pow(-2*s+2,3)/2,inOutSine:s=>-(Math.cos(Math.PI*s)-1)/2,outBack:s=>1+2.70158*Math.pow(s-1,3)+1.70158*Math.pow(s-1,2),outBackSoft:s=>1+1.9*Math.pow(s-1,3)+.9*Math.pow(s-1,2),outBounce:s=>s<1/2.75?7.5625*s*s:s<2/2.75?7.5625*(s-=1.5/2.75)*s+.75:s<2.5/2.75?7.5625*(s-=2.25/2.75)*s+.9375:7.5625*(s-=2.625/2.75)*s+.984375,outElastic:s=>{let e=2*Math.PI/3;return s===0?0:s===1?1:Math.pow(2,-10*s)*Math.sin((s*10-.75)*e)+1}},_u=class{constructor(){this.list=[],this.keys=new Map}add({duration:e=.3,delay:t=0,ease:i=yt.outCubic,update:n,key:r}){ret
